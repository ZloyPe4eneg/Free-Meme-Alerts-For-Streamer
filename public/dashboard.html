<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Панель стримера — FreeMemeAlerts</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/">Free<b>Meme</b>Alerts</a>
    <span class="spacer"></span>
    <span id="conn" class="pill off">Оверлей не подключён</span>
  </header>

  <div id="nokey" class="panel" hidden>
    <h2>Нет ключа управления</h2>
    <p class="muted">Панель открывается только в браузере, где был создан канал, или по личной ссылке для входа. Если вы зритель — вам сюда: <a id="viewerHint" href="#">страница отправки мемов</a>.</p>
  </div>

  <div id="app" class="grid2" hidden>
    <div class="stack">
      <section class="panel stack">
        <h2>Ссылки</h2>
        <label class="field">Для зрителей — киньте в чат или описание стрима
          <span class="copy"><input type="text" id="viewerUrl" readonly><button data-copy="viewerUrl">Копировать</button></span>
        </label>
        <label class="field">Оверлей для OBS — источник «Браузер», 1920×1080. Не показывайте эту ссылку на стриме
          <span class="copy"><input type="text" id="overlayUrl" readonly value="••••••••••••••••"><button data-copy="overlayUrl">Копировать</button></span>
        </label>
        <label class="field">Личная ссылка на эту панель (для входа с другого устройства) — никому не давайте
          <span class="copy"><input type="text" readonly value="••••••••••••••••"><button data-copy="adminUrl">Копировать</button></span>
        </label>
        <div class="row">
          <button id="test" class="primary">Тестовый алерт</button>
          <button id="skip">Пропустить текущий</button>
          <button id="clear" class="danger">Очистить очередь</button>
        </div>
      </section>

      <section class="panel stack">
        <h2>Настройки</h2>
        <label class="field">Название канала<input type="text" id="name" maxlength="40"></label>
        <label class="check"><input type="checkbox" id="enabled"> Принимать мемы от зрителей</label>
        <label class="check"><input type="checkbox" id="moderation"> Премодерация — показывать только после моего одобрения</label>
        <label class="check"><input type="checkbox" id="showSender"> Показывать ник и сообщение отправителя</label>
        <label class="field">Кулдаун для зрителя, секунд<input type="number" id="cooldownSec" min="0" max="3600"></label>
        <label class="field">Максимальная длина мема, секунд<input type="number" id="maxDurationSec" min="3" max="60"></label>
        <label class="field">Громкость: <span id="volLabel"></span><input type="range" id="volume" min="0" max="100"></label>
      </section>
    </div>

    <div class="stack">
      <section class="panel">
        <h2>На модерации <span id="pendingCount" class="muted"></span></h2>
        <div id="pending"></div>
      </section>
      <section class="panel">
        <h2>История</h2>
        <div id="history"></div>
      </section>
    </div>
  </div>
</div>
<script src="/common.js"></script>
<script>
const id = channelId();
let channelsList = store.get('channels', []);
let me = channelsList.find(c => c.id === id);
const hashKey = new URLSearchParams(location.hash.slice(1)).get('key');
if (hashKey) {
  // ключ из личной ссылки: запоминаем и убираем из адресной строки
  me = { id, name: me ? me.name : 'Канал', key: hashKey };
  channelsList = [me, ...channelsList.filter(c => c.id !== id)];
  store.set('channels', channelsList);
  history.replaceState(null, '', location.pathname);
}

const FIELDS = ['name', 'enabled', 'moderation', 'showSender', 'cooldownSec', 'maxDurationSec', 'volume'];
const links = { viewerUrl: location.origin + '/c/' + id, overlayUrl: '', adminUrl: '' };
const admin = (what, extra) => api(`channels/${id}/admin`, { key: me.key, do: what, ...extra }).catch(e => { toast(e.message, true); throw e; });

function readForm() {
  const s = {};
  for (const f of FIELDS) {
    const input = $('#' + f);
    s[f] = input.type === 'checkbox' ? input.checked : input.type === 'text' ? input.value : Number(input.value);
  }
  return s;
}
function fillForm(s) {
  for (const f of FIELDS) {
    const input = $('#' + f);
    if (document.activeElement === input) continue;
    if (input.type === 'checkbox') input.checked = s[f]; else input.value = s[f];
  }
  $('#volLabel').textContent = $('#volume').value + '%';
}

function itemRow(it, buttons) {
  return el('div', { class: 'item' },
    it.meme && it.meme.thumb ? el('img', { src: it.meme.thumb, alt: '', loading: 'lazy' }) : null,
    el('div', { class: 'info' },
      el('div', {}, it.meme ? it.meme.title : 'Тестовый алерт'),
      el('div', { class: 'muted small' }, it.nick + (it.message ? ': ' + it.message : ''))),
    buttons);
}
function render(state) {
  $('#conn').className = 'pill ' + (state.overlayConnected ? 'on' : 'off');
  $('#conn').textContent = state.overlayConnected ? 'Оверлей подключён' : 'Оверлей не подключён';
  fillForm(state.settings);
  store.set('settings:' + id, state.settings);
  if (me.name !== state.settings.name) { me.name = state.settings.name; store.set('channels', channelsList); }

  $('#pendingCount').textContent = state.pending.length ? `(${state.pending.length})` : '';
  $('#pending').replaceChildren(...(state.pending.length ? state.pending.map(it => itemRow(it, [
    el('button', { class: 'primary', onclick: () => admin('approve', { itemId: it.id }) }, 'Показать'),
    el('button', { class: 'danger', 'aria-label': 'Отклонить', onclick: () => admin('reject', { itemId: it.id }) }, '✕'),
  ])) : [el('div', { class: 'empty' }, state.settings.moderation ? 'Пока пусто — мемы зрителей появятся здесь.' : 'Премодерация выключена: мемы сразу идут в эфир.')]));

  $('#history').replaceChildren(...(state.history.length ? state.history.map(it => itemRow(it,
    el('button', { onclick: () => admin('replay', { itemId: it.id }) }, 'Повторить'))) : [el('div', { class: 'empty' }, 'Здесь будут показанные мемы.')]));
}

async function start() {
  if (!me) {
    $('#nokey').hidden = false;
    $('#viewerHint').href = '/c/' + id;
    return;
  }
  let first;
  try { first = await api(`channels/${id}/admin`, { key: me.key, do: 'hello' }); }
  catch (e) { $('#nokey').hidden = false; $('#viewerHint').href = '/c/' + id; toast(e.message, true); return; }
  links.overlayUrl = `${location.origin}/overlay/${id}?key=${first.overlayKey}`;
  links.adminUrl = `${location.origin}/dashboard/${id}#key=${me.key}`;
  $('#viewerUrl').value = links.viewerUrl;
  $('#app').hidden = false;

  let restored = false;
  const es = new EventSource(`/api/channels/${id}/events?key=${encodeURIComponent(me.key)}`);
  es.addEventListener('state', (e) => {
    const state = JSON.parse(e.data);
    // сервер перезапустился и забыл настройки — возвращаем сохранённые в браузере
    const saved = store.get('settings:' + id, null);
    if (state.fresh && saved && !restored) { restored = true; admin('settings', { settings: saved }); return; }
    render(state);
  });

  let saveTimer;
  for (const f of FIELDS) {
    $('#' + f).addEventListener('input', () => {
      $('#volLabel').textContent = $('#volume').value + '%';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => admin('settings', { settings: readForm() }), 400);
    });
  }
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copyText(links[b.dataset.copy])));
  $('#test').addEventListener('click', () => admin('test').then(() => toast('Тестовый алерт отправлен в оверлей')));
  $('#skip').addEventListener('click', () => admin('skip'));
  $('#clear').addEventListener('click', () => admin('clear').then(() => toast('Очередь очищена')));
}
start();
</script>
</body>
</html>
